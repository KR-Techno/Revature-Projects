<div class="auth-page">
  <div class="auth-wrap">
    <h1 class="auth-brand">Welcome to DucklingInsurance!</h1>
    <mat-card>
      <mat-card-header>
        <mat-card-title>Log in</mat-card-title>
      </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
          @if (form.controls.email.hasError('required')) {
            <mat-error>Email is required</mat-error>
          } @else if (form.controls.email.hasError('email')) {
            <mat-error>Enter a valid email address</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
          <mat-label>Password</mat-label>
          <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password" autocomplete="current-password" />
          <button mat-icon-button matSuffix type="button" (click)="hide.set(!hide())"
                  [attr.aria-label]="hide() ? 'Show password' : 'Hide password'">
            <mat-icon>{{ hide() ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
          <mat-error>Password is required</mat-error>
        </mat-form-field>

        @if (error()) {
          <p class="auth-error">{{ error() }}</p>
        }

        <button mat-flat-button type="submit" class="full" [disabled]="loading()">
          {{ loading() ? 'Logging in...' : 'Log in' }}
        </button>
      </form>

      <p class="auth-footer">New here? <a routerLink="/register">Create an account</a></p>
    </mat-card-content>
  </mat-card>
</div>
</div>
